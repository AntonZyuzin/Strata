[package]
name = "strata-desktop"
description = "Strata desktop application (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "strata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
strata-core.workspace = true
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
# «Открыть пространство…»: the system folder picker.
tauri-plugin-dialog = "2"
# A removed workspace's folder goes to the system trash, not away for good.
trash = "5"


[lints]
workspace = true
