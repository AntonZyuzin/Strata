name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust · fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy of the WASM bindings (strata-layout-wasm, strata-core-wasm)
        run: cargo clippy -p strata-layout-wasm -p strata-core-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test

  web:
    name: TypeScript · lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust toolchain with the wasm32 target (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-bindgen@0.2.129
      - name: Layout and the core as WASM (→ packages/layout/pkg, packages/backend/pkg)
        run: pnpm wasm
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @strata/ui build
      # Built once here: the e2e job and the desktop builds take it. On macOS
      # and Windows the system archiver cannot pack the wasm32 objects of a
      # core dependency (psm).
      - name: WASM for the e2e and desktop jobs
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: |
            packages/layout/pkg
            packages/backend/pkg
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # Playwright's own image carries the browsers and their system libraries:
  # `playwright install --with-deps` on the bare runner took 19 minutes and
  # once hung for an hour.
  e2e:
    name: E2E · Chromium and WebKit
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: wasm-pkg
          path: packages
      - name: Layout and gesture tests (Chromium ≈ WebView2, WebKit ≈ WKWebView)
        run: pnpm --filter @strata/ui e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-layout-screenshots
          path: packages/ui/test-results
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: Desktop · ${{ matrix.name }}
    needs: [rust, web]
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: strata-macos
            bundle: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            artifact: strata-windows
            bundle: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            artifact: strata-linux
            bundle: target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf
      - name: Rust toolchain and targets
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add $(echo "${{ matrix.rust-targets }}" | tr ',' ' ')
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: wasm-pkg
          path: packages
      - name: Clippy and tests of the shell (the UI is embedded at compile time)
        shell: bash
        run: |
          pnpm --filter @strata/ui build
          cargo clippy -p strata-desktop -- -D warnings
          cargo test -p strata-desktop
      - name: Build (unsigned)
        run: pnpm desktop:build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 30
