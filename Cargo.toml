[workspace]
resolver = "3"
members = [
    "crates/strata-model",
    "crates/strata-core",
    "crates/strata-cli",
    "crates/strata-layout",
    "crates/strata-layout-wasm",
    "crates/strata-markdown",
    "crates/strata-desktop",
    "spikes/loro-index",
]
# strata-desktop needs WebView system libraries (WebKitGTK on Linux);
# it is built by CI on macOS, Windows and Linux runners. Spikes are run by hand
# and report into docs/spikes/.
default-members = [
    "crates/strata-model",
    "crates/strata-core",
    "crates/strata-cli",
    "crates/strata-layout",
    "crates/strata-markdown",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/AntonZyuzin/Strata"
authors = ["Strata contributors"]

[workspace.dependencies]
strata-model = { path = "crates/strata-model" }
strata-core = { path = "crates/strata-core" }
strata-layout = { path = "crates/strata-layout" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", default-features = false, features = ["std", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
