[package]
name = "strata-search-wasm"
description = "WASM bindings of strata-search for the UI's search worker (09 §2.7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
strata-search.workspace = true
wasm-bindgen = "=0.2.129"

# Not the workspace lints: `forbid(unsafe_code)` rejects the exports that
# #[wasm_bindgen] generates. The engine lives in strata-search under them.
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
