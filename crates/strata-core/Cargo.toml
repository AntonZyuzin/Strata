[package]
name = "strata-core"
description = "Strata core: domain operations, invariants, storage, projection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["sqlite"]
# The workspace folder's store.sqlite (10 §3.2); off in the browser build.
sqlite = ["dep:rusqlite"]

[dependencies]
base64 = "0.22"
loro = "=1.16.2"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde.workspace = true
serde_json.workspace = true
strata-markdown.workspace = true
strata-model.workspace = true
thiserror.workspace = true
# `.strata.zip` (10 §3.5); deflate in pure Rust, so the browser build has it too.
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
