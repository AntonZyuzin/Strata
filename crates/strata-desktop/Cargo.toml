[package]
name = "strata-desktop"
description = "Strata desktop application (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "strata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The app manifest in the unit tests' binary too on Windows (build.rs); MIT.
embed-resource = "3"

[dependencies]
serde.workspace = true
serde_json.workspace = true
strata-core.workspace = true
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
# «Открыть пространство…»: the system folder picker.
tauri-plugin-dialog = "2"
# Signed updates (NFR-89); registered only with the update key baked in.
tauri-plugin-updater = "2"
# A removed workspace's folder goes to the system trash, not away for good.
trash = "5"


[lints]
workspace = true

[dev-dependencies]
# The tampered-artifact test (NFR-89): a test key signs, the mock app checks.
base64 = "0.22"
minisign = "0.7"
tauri = { version = "2", features = ["test"] }
