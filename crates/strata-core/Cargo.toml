[package]
name = "strata-core"
description = "Strata core: domain operations, invariants, storage, projection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["sqlite", "net"]
# The workspace folder's store.sqlite (10 §3.2); off in the browser build.
sqlite = ["dep:rusqlite"]
# Link previews fetched from the page (ADR-0012); off in the browser build,
# where a page cannot read another site.
net = ["dep:ureq", "dep:html5gum", "dep:url", "dep:encoding_rs"]

[dependencies]
base64 = "0.22"
loro = "=1.16.2"
# LZString of the Excalidraw plugin's drawings (13 §2.8, spike 11).
lz-str = "0.2.1"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strata-markdown.workspace = true
strata-model.workspace = true
# `L` on the networks an import fills, once (06 §9.3, 15 §2).
strata-layout.workspace = true
thiserror.workspace = true
# `.strata.zip` (10 §3.5); deflate in pure Rust, so the browser build has it too.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Link previews (ADR-0012): HTTP over the system's TLS and trust store, the
# page's head through a WHATWG tokenizer, any charset to UTF-8.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default", "gzip"], optional = true }
html5gum = { version = "0.8", optional = true }
url = { version = "2.5", optional = true }
encoding_rs = { version = "0.8", optional = true }

[lints]
workspace = true
